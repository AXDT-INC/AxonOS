# AxonOS: every Pulse client (XFCE apps, webrtc-agent ffmpeg) talks to the one
# supervisord-managed daemon, regardless of user or session environment.
default-server = unix:/tmp/axonos-pulse.sock
# Clients must never spawn private per-user daemons; apps would otherwise play
# into a sink the WebRTC capture cannot see.
autospawn = no
