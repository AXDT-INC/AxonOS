<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AxonOS — Live Telemetry</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #080b10;
  --surface:  #0d1117;
  --surface2: #141a23;
  --border:   #1c2333;
  --accent:   #00d4ff;
  --purple:   #8b5cf6;
  --green:    #22c55e;
  --yellow:   #f59e0b;
  --red:      #ef4444;
  --text:     #cdd9e5;
  --muted:    #546e7a;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 13px;
  min-height: 100vh;
}

/* ── Header ── */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 54px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }
.logo-text { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text); }
.logo-sub { font-size: 11px; color: var(--muted); margin-left: 4px; }
.header-right { display: flex; align-items: center; gap: 16px; }
#status-chip {
  font-size: 11px; padding: 3px 10px; border-radius: 20px;
  background: rgba(34,197,94,.12); color: var(--green);
  border: 1px solid rgba(34,197,94,.25);
}
#last-refresh { font-size: 11px; color: var(--muted); }
.btn {
  font-size: 12px; padding: 5px 14px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface2);
  color: var(--text); transition: border-color .15s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Layout ── */
main { padding: 24px 28px; max-width: 1440px; margin: 0 auto; }

/* ── Stat cards ── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px; margin-bottom: 24px;
}
@media(max-width:1100px){ .stat-grid{ grid-template-columns: repeat(3,1fr); } }
@media(max-width:640px) { .stat-grid{ grid-template-columns: repeat(2,1fr); } }

.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px 18px;
  position: relative; overflow: hidden;
}
.stat::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
}
.stat.c0::after { background: var(--accent); }
.stat.c1::after { background: var(--purple); }
.stat.c2::after { background: var(--green); }
.stat.c3::after { background: var(--yellow); }
.stat.c4::after { background: var(--red); }
.stat.c5::after { background: #ec4899; }
.stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 10px; }
.stat-value { font-size: 26px; font-weight: 700; line-height: 1; color: var(--text); }
.stat-sub { font-size: 11px; color: var(--muted); margin-top: 6px; }

/* ── Chart row ── */
.chart-row {
  display: grid; grid-template-columns: 3fr 1fr; gap: 16px; margin-bottom: 16px;
}
@media(max-width:900px){ .chart-row{ grid-template-columns:1fr; } }

/* ── Bottom row ── */
.bottom-row {
  display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 16px;
}
@media(max-width:1100px){ .bottom-row{ grid-template-columns:1fr 1fr; } }
@media(max-width:700px) { .bottom-row{ grid-template-columns:1fr; } }

/* ── Panels ── */
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px 20px; overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.panel-title { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 600; }
.chart-wrap { position: relative; height: 200px; }

/* ── Tables ── */
.tbl-wrap { overflow-x: auto; overflow-y: auto; max-height: 280px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th {
  font-size: 10px; text-transform: uppercase; letter-spacing: .6px;
  color: var(--muted); padding: 0 10px 8px; text-align: left; white-space: nowrap;
}
td { padding: 7px 10px; border-top: 1px solid var(--border); white-space: nowrap; }
tbody tr:hover td { background: var(--surface2); }

.mono { font-family: 'SFMono-Regular', 'Consolas', monospace; font-size: 11px; color: var(--accent); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.green { color: var(--green); }
.red   { color: var(--red); }
.yellow{ color: var(--yellow); }

.badge {
  display: inline-block; font-size: 10px; font-weight: 600; border-radius: 4px;
  padding: 1px 6px; text-transform: uppercase; letter-spacing: .3px;
}
.bmax    { background: rgba(139,92,246,.2); color: #a78bfa; }
.bsmall  { background: rgba(0,212,255,.1);  color: var(--accent); }
.bended  { background: rgba(84,110,122,.15); color: var(--muted); }
.bactive { background: rgba(34,197,94,.15); color: var(--green); }
.bfailed { background: rgba(239,68,68,.15); color: var(--red); }
.bclosed { background: rgba(84,110,122,.15); color: var(--muted); }
.bdeposit { background: rgba(34,197,94,.15); color: var(--green); }
.busage   { background: rgba(239,68,68,.1);  color: #fca5a5; }
.bexpiry  { background: rgba(84,110,122,.1); color: var(--muted); }

/* ── Events feed ── */
.ev-list { display: flex; flex-direction: column; max-height: 280px; overflow-y: auto; }
.ev-row {
  display: grid; grid-template-columns: 60px 80px 1fr auto auto;
  align-items: center; gap: 10px;
  padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 11px;
}
.ev-row:last-child { border-bottom: none; }
.ev-time { color: var(--muted); font-size: 10px; }
.ev-delta { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.ev-bal   { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading { display: flex; align-items: center; gap: 8px; color: var(--muted); padding: 20px 0; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    <span class="logo-text">AxonOS</span>
    <span class="logo-sub">Live Telemetry</span>
  </div>
  <div class="header-right">
    <span id="status-chip">● Live</span>
    <span id="last-refresh"></span>
    <button class="btn" onclick="loadAll()">Refresh</button>
  </div>
</header>

<main>

  <!-- Stat cards -->
  <div class="stat-grid">
    <div class="stat c0">
      <div class="stat-label">Total Sessions</div>
      <div class="stat-value" id="s-total">—</div>
      <div class="stat-sub" id="s-active"></div>
    </div>
    <div class="stat c1">
      <div class="stat-label">Unique Wallets</div>
      <div class="stat-value" id="s-wallets">—</div>
      <div class="stat-sub" id="s-wallets-sub"></div>
    </div>
    <div class="stat c2">
      <div class="stat-label">GPU·Minutes Used</div>
      <div class="stat-value" id="s-consumed">—</div>
      <div class="stat-sub" id="s-remaining"></div>
    </div>
    <div class="stat c3">
      <div class="stat-label">Wall·Clock Hours</div>
      <div class="stat-value" id="s-hours">—</div>
      <div class="stat-sub" id="s-hours-sub"></div>
    </div>
    <div class="stat c4">
      <div class="stat-label">WebRTC Streams</div>
      <div class="stat-value" id="s-webrtc">—</div>
      <div class="stat-sub" id="s-webrtc-sub"></div>
    </div>
    <div class="stat c5">
      <div class="stat-label">Failed Allocs</div>
      <div class="stat-value" id="s-failed">—</div>
      <div class="stat-sub" id="s-failed-sub"></div>
    </div>
  </div>

  <!-- Chart row -->
  <div class="chart-row">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">Sessions — Hourly Activity</span>
      </div>
      <div class="chart-wrap"><canvas id="chart-timeline"></canvas></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">Duration Buckets</span>
      </div>
      <div class="chart-wrap"><canvas id="chart-dur"></canvas></div>
    </div>
  </div>

  <!-- Bottom row -->
  <div class="bottom-row">

    <!-- Recent sessions -->
    <div class="panel">
      <div class="panel-head"><span class="panel-title">Recent Sessions</span></div>
      <div class="tbl-wrap" id="tbl-sessions">
        <div class="loading"><div class="spinner"></div> Loading…</div>
      </div>
    </div>

    <!-- Wallet breakdown -->
    <div class="panel">
      <div class="panel-head"><span class="panel-title">Wallets</span></div>
      <div class="tbl-wrap" id="tbl-wallets">
        <div class="loading"><div class="spinner"></div> Loading…</div>
      </div>
    </div>

    <!-- Ledger events -->
    <div class="panel">
      <div class="panel-head"><span class="panel-title">Ledger Events</span></div>
      <div id="ev-feed">
        <div class="loading"><div class="spinner"></div> Loading…</div>
      </div>
    </div>

  </div>

</main>

<script>
const API = '';   // same origin (port 6080)
let chartTL = null, chartDur = null;

async function api(path) {
  const r = await fetch(API + path);
  return r.json();
}

async function loadAll() {
  try {
    const [sum, sess, wallets, events] = await Promise.all([
      api('/api/public/telemetry/summary'),
      api('/api/public/telemetry/sessions?limit=300'),
      api('/api/public/telemetry/wallets'),
      api('/api/public/telemetry/events?limit=120'),
    ]);
    renderStats(sum);
    if (sess.sessions) { renderTimeline(sess.sessions); renderDur(sess.sessions); renderSessions(sess.sessions); }
    if (wallets.wallets) renderWallets(wallets.wallets);
    if (events.events)  renderEvents(events.events);
    document.getElementById('last-refresh').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('status-chip').textContent = '● Error';
    document.getElementById('status-chip').style.cssText = 'background:rgba(239,68,68,.12);color:#ef4444;border-color:rgba(239,68,68,.25)';
  }
}

// ── Stats ──
function renderStats(d) {
  const s = d.sessions, dep = d.deposits, w = d.webrtc;
  set('s-total', s.total.toLocaleString());
  set('s-active', s.active > 0 ? s.active + ' active now' : 'all sessions ended');
  set('s-wallets', s.unique_wallets);
  set('s-wallets-sub', s.total + ' sessions total');
  set('s-consumed', Math.round(dep.total_consumed_minutes).toLocaleString());
  set('s-remaining', Math.round(dep.total_remaining_minutes).toLocaleString() + ' min remaining');
  const hrs = (s.total_wall_minutes / 60).toFixed(1);
  set('s-hours', hrs);
  set('s-hours-sub', Math.round(s.total_wall_minutes).toLocaleString() + ' total minutes');
  set('s-webrtc', w.total);
  set('s-webrtc-sub', w.closed + ' closed · ' + w.failed + ' failed');
  set('s-failed', s.failed_allocations);
  set('s-failed-sub', s.total > 0 ? ((s.failed_allocations/s.total)*100).toFixed(1)+'% rate' : '');
}
function set(id, v) { const e = document.getElementById(id); if(e) e.textContent = v ?? '—'; }

// ── Timeline chart ──
function renderTimeline(sessions) {
  const buckets = {};
  sessions.forEach(s => {
    const d = new Date(s.started_at * 1000);
    const k = d.toISOString().slice(0,13) + ':00';
    buckets[k] = (buckets[k] || 0) + 1;
  });
  const all = Object.keys(buckets).sort();
  const labels = all.slice(-36);
  const data   = labels.map(k => buckets[k]);
  const ctx = document.getElementById('chart-timeline').getContext('2d');
  if (chartTL) chartTL.destroy();
  chartTL = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{
      data, backgroundColor: 'rgba(0,212,255,.28)',
      borderColor: '#00d4ff', borderWidth: 1, borderRadius: 3,
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { title: t => t[0].label + ' UTC' }}},
      scales: {
        x: { ticks: { color:'#546e7a', maxTicksLimit:8, font:{size:9} }, grid: { color:'#1c2333' }},
        y: { ticks: { color:'#546e7a', font:{size:10} }, grid: { color:'#1c2333' }, beginAtZero:true }
      }
    }
  });
}

// ── Duration doughnut ──
function renderDur(sessions) {
  const bins  = [0,0,0,0,0,0];
  const labs  = ['<2m','2–5m','5–15m','15–30m','30–60m','>60m'];
  const cols  = ['#ef4444','#f59e0b','#22c55e','#00d4ff','#8b5cf6','#ec4899'];
  sessions.forEach(s => {
    const m = s.duration_minutes;
    if      (m<2)  bins[0]++;
    else if (m<5)  bins[1]++;
    else if (m<15) bins[2]++;
    else if (m<30) bins[3]++;
    else if (m<60) bins[4]++;
    else           bins[5]++;
  });
  const ctx = document.getElementById('chart-dur').getContext('2d');
  if (chartDur) chartDur.destroy();
  chartDur = new Chart(ctx, {
    type: 'doughnut',
    data: { labels: labs, datasets: [{
      data: bins,
      backgroundColor: cols.map(c => c+'55'),
      borderColor: cols, borderWidth: 1.5,
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position:'bottom', labels:{ color:'#8899aa', font:{size:10}, boxWidth:10, padding:8 }}},
      cutout: '62%',
    }
  });
}

// ── Sessions table ──
function renderSessions(sessions) {
  const el = document.getElementById('tbl-sessions');
  if (!sessions.length) { el.innerHTML = '<div class="loading muted">No sessions yet</div>'; return; }
  const rows = sessions.slice(0,80).map(s => {
    const st = s.allocation_status === 'failed' ? 'failed' : s.status;
    return `<tr>
      <td class="muted" style="font-size:10px">#${s.id}</td>
      <td class="mono">${sw(s.wallet_address)}</td>
      <td><span class="badge b${s.requested_profile}">${s.requested_profile}</span></td>
      <td class="muted" style="font-size:10px">${ft(s.started_at)}</td>
      <td class="num muted">${s.duration_minutes}m</td>
      <td><span class="badge b${st}">${st}</span></td>
    </tr>`;
  }).join('');
  el.innerHTML = `<table><thead><tr><th>#</th><th>Wallet</th><th>Profile</th><th>Started</th><th class="num">Duration</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ── Wallets ──
function renderWallets(wallets) {
  const el = document.getElementById('tbl-wallets');
  if (!wallets.length) { el.innerHTML = '<div class="loading muted">No wallets yet</div>'; return; }
  const rows = wallets.map(w => `<tr>
    <td class="mono">${sw(w.wallet_address)}</td>
    <td class="num">${w.total_sessions}</td>
    <td class="num">${Math.round(w.total_wall_minutes)}m</td>
    <td class="num">${Math.round(w.remaining_minutes)}m</td>
  </tr>`).join('');
  el.innerHTML = `<table><thead><tr><th>Wallet</th><th class="num">Sessions</th><th class="num">Active</th><th class="num">Balance</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ── Events feed ──
function renderEvents(events) {
  const el = document.getElementById('ev-feed');
  if (!events.length) { el.innerHTML = '<div class="loading muted">No events yet</div>'; return; }
  const rows = events.slice(0,60).map(e => {
    const delta = e.minutes_delta;
    const cls = delta > 0 ? 'green' : delta < 0 ? 'red' : 'muted';
    const dstr = delta > 0 ? '+'+delta.toFixed(1)+'m' : delta < 0 ? delta.toFixed(1)+'m' : evlabel(e.event_type);
    const etCls = e.event_type === 'deposit_credit' ? 'bdeposit' : e.event_type === 'usage_deduction' ? 'busage' : 'bexpiry';
    return `<div class="ev-row">
      <span class="ev-time">${ft(e.created_at)}</span>
      <span><span class="badge ${etCls}">${evlabel(e.event_type)}</span></span>
      <span class="mono">${sw(e.wallet_address)}</span>
      <span class="ev-delta ${cls}">${dstr}</span>
      <span class="ev-bal">${e.balance_after_minutes.toFixed(0)}m</span>
    </div>`;
  }).join('');
  el.innerHTML = `<div class="ev-list">${rows}</div>`;
}

// ── Helpers ──
function sw(w) {
  if (!w) return '—';
  return w.slice(0,6)+'…'+w.slice(-4);
}
function ft(ts) {
  if (!ts) return '—';
  const d = new Date(ts*1000);
  return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function evlabel(t) {
  return {deposit_credit:'deposit', usage_deduction:'usage', session_expiry:'expiry',
          refund:'refund', verification_reject:'reject'}[t] || t;
}

// Auto-load on open, then refresh every 60s
loadAll();
setInterval(loadAll, 60000);
</script>
</body>
</html>
