# AxonOS – single-instance stack (noVNC + AXGT gate + session launcher)
#
# From repo root with .env:
#   docker compose build
#   docker compose up -d
#
# UI: http://HOST:6080/vnc.html  —  gate API: 8889
#
# Image tag axonos:latest — the same tag scripts/build_axonos.sh and the launcher CLI default to.
# Each session gets a launcher-managed bridge shared only with the central gate;
# Postgres and the Docker-socket launcher remain on axonos_control.
# AXGT_CHALLENGE_DB_URL is set on the axonos service to this stack's postgres only.

name: axonos

services:
  axonos-launcher:
    build:
      context: .
      dockerfile: docker/launcher/Dockerfile
    env_file: .env
    container_name: axonos_session_launcher
    environment:
      AXGT_SESSION_LAUNCHER_BIND_HOST: 0.0.0.0
      AXGT_SESSION_LAUNCHER_BIND_PORT: ${AXGT_SESSION_LAUNCHER_BIND_PORT:-8090}
      AXGT_SESSION_LAUNCHER_TOKEN: ${AXGT_SESSION_LAUNCHER_TOKEN:-change-me-launcher-token}
      # Card processing credentials belong only to the central public gate.
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      # Explicitly erase the entire optional X integration namespace inherited
      # from the shared .env. The privileged Docker-socket launcher neither
      # needs nor receives its configuration, identifiers, paths, or secrets.
      X_CAPI_ACCESS_TOKEN: ""
      X_CAPI_ACCESS_TOKEN_FILE: ""
      X_CAPI_DB_URL: ""
      X_CAPI_DB_URL_FILE: ""
      X_CAPI_CONTEXT_KEY: ""
      X_CAPI_CONTEXT_KEY_FILE: ""
      X_CAPI_HASH_KEY: ""
      X_CAPI_HASH_KEY_FILE: ""
      X_CAPI_ACCESS_TOKEN_HOST_FILE: ""
      X_CAPI_DB_URL_HOST_FILE: ""
      X_CAPI_CONTEXT_KEY_HOST_FILE: ""
      X_CAPI_HASH_KEY_HOST_FILE: ""
      X_CAPI_RUNTIME_HOST_DIR: ""
      X_CAPI_MODE: ""
      X_CAPI_PIXEL_ID: ""
      X_CAPI_EVENT_WALLET_VERIFIED: ""
      X_CAPI_EVENT_DEPOSIT_COMPLETED: ""
      X_CAPI_EVENT_SESSION_STARTED: ""
      X_CAPI_ALLOWED_ORIGIN: ""
      X_CAPI_DEPLOYMENT_ID: ""
      X_CAPI_CONSENT_POLICY_VERSION: ""
      X_CAPI_CONSENT_POLICY_EPOCH: ""
      X_CAPI_TWCLID_CONTRACT_VERSION: ""
      X_CAPI_TWCLID_CHARSET: ""
      X_CAPI_TWCLID_MIN_LENGTH: ""
      X_CAPI_TWCLID_MAX_LENGTH: ""
      X_CAPI_ATTRIBUTION_TTL_DAYS: ""
      X_CAPI_MAX_EVENT_AGE_HOURS: ""
      X_CAPI_SEND_VALUES: ""
      X_CAPI_QUEUE_LIMIT: ""
      X_CAPI_CONTEXT_LIMIT: ""
      X_CAPI_PRODUCTION_CHAIN_IDS: ""
      X_CAPI_EXCLUDED_WALLETS: ""
      X_CAPI_INGEST_SOCKET: ""
      X_CAPI_CONSENT_SOCKET: ""
      X_CAPI_INGEST_ALLOWED_UID: ""
      X_CAPI_WORKER_UID: ""
      X_CAPI_TWCLID: ""
      X_CAPI_ALLOW_TEST_DB_URL: ""
      X_CAPI_ALLOW_TEST_CONFIG_GUARD_BYPASS: ""
      X_CAPI_ALLOW_TEST_CONFIG_GUARD_FILE: ""
      X_CAPI_ALLOW_TEST_RATE_FILE: ""
      X_CAPI_ALLOW_TEST_SECRETS: ""
      X_CAPI_ALLOW_TEST_SOCKET: ""
      X_CAPI_ALLOW_TEST_PRIVACY_FENCE: ""
      X_CAPI_CONFIG_GUARD_FILE: ""
      X_CAPI_TEST_DB_URL: ""
      X_CAPI_UNUSED_DB_SECRET_VALUE: ""
      X_CAPI_RATE_LIMIT_PER_MIN: ""
      X_CAPI_GLOBAL_RATE_LIMIT_PER_MIN: ""
      X_CAPI_PRIVACY_RATE_LIMIT_PER_MIN: ""
      X_CAPI_TRUSTED_PROXY_CIDRS: ""
      X_CAPI_TRUSTED_PROXY_HOPS: ""
      X_CAPI_WORKER_DB_ROLE: ""
      X_CAPI_UPGRADE_V1: ""
      X_CAPI_PRIVACY_FENCE_DIR: ""
      X_CAPI_PRIVACY_RECOVERY_EPOCH: ""
      X_CAPI_POSTGRES_DB: ""
      X_CAPI_POSTGRES_BOOTSTRAP_USER: ""
      X_CAPI_POSTGRES_BOOTSTRAP_PASSWORD_HOST_FILE: ""
      X_CAPI_POSTGRES_WORKER_PASSWORD_HOST_FILE: ""
      X_CAPI_OWNER_DB_ROLE: ""
      AXGT_CHALLENGE_DB_URL: postgresql://${POSTGRES_USER:-axonos_gate}:${POSTGRES_PASSWORD:-axonos_gate_secret}@postgres:5432/${POSTGRES_DB:-axonos_gate}
      AXGT_SESSION_DB_CONNECT_TIMEOUT_SECONDS: ${AXGT_SESSION_DB_CONNECT_TIMEOUT_SECONDS:-5}
      # Session desktops must run the WebRTC capture agent; base gate stack disables it (see startup.sh).
      WEBRTC_ENABLED: ${WEBRTC_ENABLED:-false}
      WEBRTC_AGENT_ENABLED: "true"
      AXGT_HOST_SESSION_CONTAINER_IMAGE: ${AXGT_HOST_SESSION_CONTAINER_IMAGE:-axonos:latest}
      # Used only when the explicit isolation escape hatch is disabled.
      AXGT_HOST_SESSION_CONTAINER_NETWORK: ${AXGT_HOST_SESSION_CONTAINER_NETWORK:-axonos_stack}
      AXGT_HOST_SESSION_NETWORK_ISOLATION: ${AXGT_HOST_SESSION_NETWORK_ISOLATION:-true}
      AXGT_HOST_CENTRAL_GATE_CONTAINER: ${AXGT_HOST_CENTRAL_GATE_CONTAINER:-axonos}
      AXGT_HOST_SESSION_CONTAINER_COMMAND: ${AXGT_HOST_SESSION_CONTAINER_COMMAND:-/startup.sh}
      AXGT_HOST_SESSION_CONTAINER_EXTRA_ARGS: ${AXGT_HOST_SESSION_CONTAINER_EXTRA_ARGS:-}
      AXGT_HOST_SESSION_CONTAINER_SHM_SIZE: ${AXGT_HOST_SESSION_CONTAINER_SHM_SIZE:-32g}
      AXGT_HOST_SESSION_LXCFS_DIR: ${AXGT_HOST_SESSION_LXCFS_DIR:-}
      AXGT_PERSISTENT_STORAGE_ENABLED: ${AXGT_PERSISTENT_STORAGE_ENABLED:-true}
      # Preserve explicit empty values so the launcher rejects invalid policy.
      AXGT_STORAGE_MAINTENANCE_ENABLED: ${AXGT_STORAGE_MAINTENANCE_ENABLED-true}
      AXGT_PERSISTENT_STORAGE_VOLUME_PREFIX: ${AXGT_PERSISTENT_STORAGE_VOLUME_PREFIX:-axgt-user-storage-}
      AXGT_PERSISTENT_STORAGE_MOUNT_PATH: ${AXGT_PERSISTENT_STORAGE_MOUNT_PATH:-/home/aXonian}
      AXGT_PERSISTENT_STORAGE_CLEANUP_INTERVAL_SECONDS: ${AXGT_PERSISTENT_STORAGE_CLEANUP_INTERVAL_SECONDS:-3600}
      AXGT_PERSISTENT_STORAGE_MIN_BALANCE_LIMIT_MINUTES: ${AXGT_PERSISTENT_STORAGE_MIN_BALANCE_LIMIT_MINUTES:--1440.0}
      AXGT_PERSISTENT_STORAGE_GB_HOUR_COST_MINUTES: ${AXGT_PERSISTENT_STORAGE_GB_HOUR_COST_MINUTES:-0.05}



      # Tenant sessions receive media tuning only. Identity, the signed WebRTC
      # capability, and central gate URLs are injected explicitly by the launcher.
      # Database, payment/RPC, launcher, and fleet signing credentials stay central.
      AXGT_HOST_SESSION_ENV_PASSTHROUGH: ${AXGT_HOST_SESSION_ENV_PASSTHROUGH:-WEBRTC_DISPLAY_WAIT_SECONDS,WEBRTC_STUN_URLS,WEBRTC_TURN_URLS,WEBRTC_TURN_USERNAME,WEBRTC_TURN_CREDENTIAL,WEBRTC_CAPTURE_BACKEND,WEBRTC_CAPTURE_FPS,WEBRTC_CAPTURE_BITRATE,WEBRTC_CAPTURE_NVENC_PRESET,WEBRTC_CAPTURE_NVENC_TUNE,WEBRTC_CAPTURE_NVFBC_BIN,WEBRTC_CAPTURE_NVFBC_PRESET,WEBRTC_CAPTURE_LOW_LATENCY,WEBRTC_CAPTURE_MAX_WIDTH,WEBRTC_CAPTURE_DISPLAY,WEBRTC_LOCAL_CURSOR,WEBRTC_CAPTURE_MAX_STALE_FRAMES,WEBRTC_CLIPBOARD_MAX_BYTES,WEBRTC_CLIPBOARD_POLL_PRIMARY,WEBRTC_PUBLIC_IP,WEBRTC_AUDIO_ENABLED,WEBRTC_AUDIO_SOURCE,WEBRTC_MIC_ENABLED,WEBRTC_MIC_SINK}
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/axonos_storage:/var/lib/docker/axonos_storage
      - /dev:/dev
    networks:
      - axonos_control
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:4.6.2-alpine
    container_name: axonos_coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      # Host 443 now belongs to the files-tls demux below, which forwards
      # non-TLS bytes (plain TURN-over-TCP, advertised as
      # turn:...:443?transport=tcp in WEBRTC_TURN_URLS) here to :3478.
      # UDP 41000 is reserved for NetBird WireGuard (host network) — see
      # gpu-bare-metal-machine compose NB_WIREGUARD_PORT; coturn stops at 40999.
      - "40500-40999:40500-40999/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    networks:
      - axonos_stack

  # Direct file plane: shares public TCP 443 between HTTPS (bulk /api/files/*
  # straight to the gate — bypasses the OKE proxy chain, whose upload direction
  # is slow for remote users) and coturn's plain TURN-over-TCP fallback.
  # Needs a Let's Encrypt cert in the axonos_letsencrypt volume first — see
  # docs in docker/files-tls/nginx.conf.template; the command below idles
  # until the cert appears so the stack can come up before issuance.
  files-tls:
    image: nginx:1.27-alpine
    container_name: axonos_files_tls
    restart: unless-stopped
    ports:
      - "443:443/tcp"
    environment:
      FILES_TLS_SERVER_NAME: ${FILES_TLS_SERVER_NAME:-axonconsole.io}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./docker/files-tls/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./docker/files-tls/40-wait-for-cert.sh:/docker-entrypoint.d/40-wait-for-cert.sh:ro
      - axonos_letsencrypt:/etc/letsencrypt:ro
    # No command override: the image entrypoint only renders the config
    # template (and runs 40-wait-for-cert.sh) when the command is the stock
    # `nginx -g "daemon off;"`.
    networks:
      - axonos_stack

  postgres:
    image: postgres:15-alpine
    container_name: axonos_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axonos_gate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axonos_gate_secret}
      POSTGRES_DB: ${POSTGRES_DB:-axonos_gate}
    volumes:
      - axonos_postgres_data:/var/lib/postgresql/data
    networks:
      - axonos_control
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axonos_gate} -d ${POSTGRES_DB:-axonos_gate}"]
      interval: 5s
      timeout: 5s
      retries: 5

  axonos:
    image: axonos:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PASSWORD: ${AXONOS_VNC_PASSWORD}
        # Pin to host `nvidia-smi` Driver Version — see env.example / Dockerfile NVIDIA_DRIVER_PKG_VERSION.
        NVIDIA_DRIVER_PKG_VERSION: ${NVIDIA_DRIVER_PKG_VERSION:-}
      tags:
        - axonos:latest
    container_name: axonos
    shm_size: "32gb"
    env_file: .env
    # Utility-only GPU visibility for the central NVML telemetry collector.
    # GPU device access is shareable; the disabled base desktop does not launch
    # Xorg or reserve devices away from launcher-managed tenant sessions.
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_MIN_AMOUNT_USD: ${STRIPE_MIN_AMOUNT_USD:-1}
      STRIPE_MAX_AMOUNT_USD: ${STRIPE_MAX_AMOUNT_USD:-1000}
      AXGT_CHALLENGE_DB_URL: postgresql://${POSTGRES_USER:-axonos_gate}:${POSTGRES_PASSWORD:-axonos_gate_secret}@postgres:5432/${POSTGRES_DB:-axonos_gate}
      # Non-secret producer mapping. The dedicated access token is never given
      # to this gate; only the isolated worker reads its secret file.
      X_CAPI_MODE: ${X_CAPI_MODE:-off}
      X_CAPI_PIXEL_ID: ${X_CAPI_PIXEL_ID:-}
      X_CAPI_EVENT_WALLET_VERIFIED: ${X_CAPI_EVENT_WALLET_VERIFIED:-}
      X_CAPI_EVENT_DEPOSIT_COMPLETED: ${X_CAPI_EVENT_DEPOSIT_COMPLETED:-}
      X_CAPI_EVENT_SESSION_STARTED: ${X_CAPI_EVENT_SESSION_STARTED:-}
      X_CAPI_ALLOWED_ORIGIN: ${X_CAPI_ALLOWED_ORIGIN:-}
      X_CAPI_DEPLOYMENT_ID: ${X_CAPI_DEPLOYMENT_ID:-}
      X_CAPI_CONSENT_POLICY_VERSION: ${X_CAPI_CONSENT_POLICY_VERSION:-x-capi-v1}
      X_CAPI_CONSENT_POLICY_EPOCH: ${X_CAPI_CONSENT_POLICY_EPOCH:-}
      X_CAPI_TWCLID_CONTRACT_VERSION: ${X_CAPI_TWCLID_CONTRACT_VERSION:-}
      X_CAPI_TWCLID_CHARSET: ${X_CAPI_TWCLID_CHARSET:-}
      X_CAPI_TWCLID_MIN_LENGTH: ${X_CAPI_TWCLID_MIN_LENGTH:-}
      X_CAPI_TWCLID_MAX_LENGTH: ${X_CAPI_TWCLID_MAX_LENGTH:-}
      X_CAPI_ATTRIBUTION_TTL_DAYS: ${X_CAPI_ATTRIBUTION_TTL_DAYS:-7}
      X_CAPI_MAX_EVENT_AGE_HOURS: ${X_CAPI_MAX_EVENT_AGE_HOURS:-24}
      X_CAPI_SEND_VALUES: ${X_CAPI_SEND_VALUES:-false}
      X_CAPI_QUEUE_LIMIT: ${X_CAPI_QUEUE_LIMIT:-10000}
      X_CAPI_CONTEXT_LIMIT: ${X_CAPI_CONTEXT_LIMIT:-10000}
      X_CAPI_PRIVACY_RATE_LIMIT_PER_MIN: ${X_CAPI_PRIVACY_RATE_LIMIT_PER_MIN:-60}
      X_CAPI_GLOBAL_RATE_LIMIT_PER_MIN: ${X_CAPI_GLOBAL_RATE_LIMIT_PER_MIN:-300}
      X_CAPI_RATE_LIMIT_PER_MIN: ${X_CAPI_RATE_LIMIT_PER_MIN:-30}
      X_CAPI_TRUSTED_PROXY_CIDRS: ${X_CAPI_TRUSTED_PROXY_CIDRS:-}
      X_CAPI_TRUSTED_PROXY_HOPS: ${X_CAPI_TRUSTED_PROXY_HOPS:-0}
      X_CAPI_PRODUCTION_CHAIN_IDS: ${X_CAPI_PRODUCTION_CHAIN_IDS:-1,8453}
      X_CAPI_CONFIG_GUARD_FILE: /run/axonos-x-capi/config-guard.json
      X_CAPI_WORKER_UID: "10001"
      # Never honor access-token/worker-DB/hash secrets inherited from .env.
      X_CAPI_ACCESS_TOKEN: ""
      X_CAPI_ACCESS_TOKEN_FILE: ""
      X_CAPI_DB_URL: ""
      X_CAPI_DB_URL_FILE: ""
      X_CAPI_CONTEXT_KEY: ""
      X_CAPI_CONTEXT_KEY_FILE: ""
      X_CAPI_HASH_KEY: ""
      X_CAPI_HASH_KEY_FILE: ""
      X_CAPI_ACCESS_TOKEN_HOST_FILE: ""
      X_CAPI_DB_URL_HOST_FILE: ""
      X_CAPI_CONTEXT_KEY_HOST_FILE: ""
      X_CAPI_HASH_KEY_HOST_FILE: ""
      X_CAPI_RUNTIME_HOST_DIR: ""
      X_CAPI_ALLOW_TEST_CONFIG_GUARD_BYPASS: ""
      X_CAPI_ALLOW_TEST_CONFIG_GUARD_FILE: ""
      X_CAPI_ALLOW_TEST_DB_URL: ""
      X_CAPI_ALLOW_TEST_RATE_FILE: ""
      X_CAPI_ALLOW_TEST_SECRETS: ""
      X_CAPI_ALLOW_TEST_SOCKET: ""
      X_CAPI_ALLOW_TEST_PRIVACY_FENCE: ""
      X_CAPI_TEST_DB_URL: ""
      X_CAPI_UNUSED_DB_SECRET_VALUE: ""
      X_CAPI_PRIVACY_FENCE_DIR: ""
      X_CAPI_PRIVACY_RECOVERY_EPOCH: ""
      X_CAPI_POSTGRES_DB: ""
      X_CAPI_POSTGRES_BOOTSTRAP_USER: ""
      X_CAPI_POSTGRES_BOOTSTRAP_PASSWORD_HOST_FILE: ""
      X_CAPI_POSTGRES_WORKER_PASSWORD_HOST_FILE: ""
      X_CAPI_OWNER_DB_ROLE: ""
      AXGT_USER_CONTAINER_ENABLED: ${AXGT_USER_CONTAINER_ENABLED:-true}
      # Gate-only on base axonos: no Xorg (GPU :0 reserved for axgt-session-* desktops).
      AXGT_DESKTOP_ENABLED: ${AXGT_DESKTOP_ENABLED:-false}
      AXGT_SESSION_LAUNCHER_MODE: ${AXGT_SESSION_LAUNCHER_MODE:-http}
      AXGT_SESSION_LAUNCHER_URL: ${AXGT_SESSION_LAUNCHER_URL:-http://axonos-launcher:8090}
      AXGT_SESSION_LAUNCHER_TOKEN: ${AXGT_SESSION_LAUNCHER_TOKEN:-change-me-launcher-token}
      # Persistent NVML collector shared by forked gate workers. One-second
      # samples avoid the 15–22s lag of spawning nvidia-smi on every cycle.
      AXGT_GPU_TELEMETRY_INTERVAL_SECONDS: ${AXGT_GPU_TELEMETRY_INTERVAL_SECONDS:-1.0}
      AXGT_GPU_TELEMETRY_FILE: ${AXGT_GPU_TELEMETRY_FILE:-/run/axonos/gpu-telemetry.json}
      AXGT_PERSISTENT_STORAGE_ENABLED: ${AXGT_PERSISTENT_STORAGE_ENABLED:-true}
      AXGT_PERSISTENT_STORAGE_VOLUME_PREFIX: ${AXGT_PERSISTENT_STORAGE_VOLUME_PREFIX:-axgt-user-storage-}
      AXGT_PERSISTENT_STORAGE_MOUNT_PATH: ${AXGT_PERSISTENT_STORAGE_MOUNT_PATH:-/home/aXonian}
      AXGT_PERSISTENT_STORAGE_GB_HOUR_COST_MINUTES: ${AXGT_PERSISTENT_STORAGE_GB_HOUR_COST_MINUTES:-0.05}
      AXGT_PERSISTENT_STORAGE_MIN_BALANCE_LIMIT_MINUTES: ${AXGT_PERSISTENT_STORAGE_MIN_BALANCE_LIMIT_MINUTES:--1440.0}

      # Direct-SSH session toggle: public host the gate puts in the `ssh -p <port> <user>@<host>`
      # connect-string. Set to the media-plane public IP (per-session TCP 42000-42049 are
      # published by the launcher and NAT'd to it). Empty disables the toggle's usefulness
      # (UI would fall back to the page hostname, which is the OKE proxy — not reachable for SSH).
      AXGT_SSH_PUBLIC_HOST: ${AXGT_SSH_PUBLIC_HOST:-}
      AXGT_SSH_USER: ${AXGT_SSH_USER:-aXonian}

      # Gate must listen on all interfaces so isolated agents can reach http://axonos-gate:8889.
      GATE_HOST: ${GATE_HOST:-0.0.0.0}
      GATE_PORT: ${GATE_PORT:-8889}
      # Central WebRTC capability signing key. Never forwarded to tenant sessions.
      # Legacy single-container mode also uses it directly on localhost.
      WEBRTC_ENABLED: ${WEBRTC_ENABLED:-false}
      # webrtc.config forces this off in user-container mode (where no classic
      # VNC listener exists) while preserving legacy single-container fallback.
      WEBRTC_FALLBACK_ENABLED: ${WEBRTC_FALLBACK_ENABLED:-true}
      WEBRTC_AGENT_INTERNAL_KEY: ${WEBRTC_AGENT_INTERNAL_KEY:-}
      # Do not honor the historical :8889 override: agent routes exist only on
      # the central, un-published 8890 listener.
      WEBRTC_GATE_INTERNAL_URL: http://127.0.0.1:8890
      WEBRTC_STUN_URLS: ${WEBRTC_STUN_URLS:-}
      WEBRTC_TURN_URLS: ${WEBRTC_TURN_URLS:-}
      WEBRTC_TURN_USERNAME: ${WEBRTC_TURN_USERNAME:-}
      WEBRTC_TURN_CREDENTIAL: ${WEBRTC_TURN_CREDENTIAL:-}
      WEBRTC_CLIPBOARD_POLL_PRIMARY: ${WEBRTC_CLIPBOARD_POLL_PRIMARY:-false}
      WEBRTC_SESSION_TIMEOUT_SECONDS: ${WEBRTC_SESSION_TIMEOUT_SECONDS:-600}
      WEBRTC_MAX_RECONNECT_ATTEMPTS: ${WEBRTC_MAX_RECONNECT_ATTEMPTS:-5}
      WEBRTC_SIGNAL_RATE_LIMIT_PER_MIN: ${WEBRTC_SIGNAL_RATE_LIMIT_PER_MIN:-60}
      WEBRTC_ANSWER_WAIT_MS: ${WEBRTC_ANSWER_WAIT_MS:-180000}
    depends_on:
      postgres:
        condition: service_healthy
      axonos-launcher:
        condition: service_healthy
    # Theme/wallpaper applied from startup.sh after 35s delay
    command: ["/startup.sh"]
    ports:
      - "${AXONOS_PUBLISH_NOVNC:-6080}:6080"
      - "${AXONOS_PUBLISH_GATE:-8889}:8889"
      # UDP range for WebRTC ICE srflx is published per-session by the launcher,
      # not here — base container does not run the WebRTC agent in multi-user mode.
    # axgt-session-* still receive exact devices via --gpus device=N. The base
    # container exposes only the NVIDIA utility capability for fleet telemetry.
    networks:
      - axonos_control
      - axonos_stack
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os,socket; enabled=os.getenv('WEBRTC_ENABLED','').strip().lower() in ('1','true','yes','on'); ports=(6080,8889,8890) if enabled else (6080,8889); [socket.create_connection(('127.0.0.1',port),2).close() for port in ports]\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

networks:
  axonos_control:
    name: axonos_control
  axonos_stack:
    name: axonos_stack
    driver: bridge
volumes:
  axonos_postgres_data: {}
  axonos_letsencrypt:
    # Fixed name so one-shot certbot runs can mount it without the compose
    # project prefix: docker run -v axonos_letsencrypt:/etc/letsencrypt ...
    # External because certbot provisions it, not compose. Without this, a
    # missing volume would be silently recreated EMPTY and the TLS listener
    # would start with no certificate; external makes compose fail loudly
    # instead. Create it before first bring-up on a new host:
    #   docker volume create axonos_letsencrypt
    external: true
    name: axonos_letsencrypt
