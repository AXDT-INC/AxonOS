# AxonOS – noVNC + AXGT gate (deposit-credit branch / parallel test stack)
#
# This file is tuned to run ALONGSIDE a main-branch stack on the same host:
#   - Published ports default to 16080 (noVNC) and 18889 (gate) — main uses 6080/8889.
#   - Project name + container names + volume are isolated from a default "axonos" compose.
#   - Image tag axonos:deposit-preview so `docker compose build` does not overwrite axonos:latest.
#
# Build and run (from repo root, with .env present):
#   docker compose build
#   docker compose up -d
#
# Access test UI: http://HOST:16080/vnc.html  —  gate / tunnel: port 18889
#
# Override ports (e.g. match main): AXONOS_PUBLISH_NOVNC=6080 AXONOS_PUBLISH_GATE=8889 docker compose up -d
#
# AXGT_CHALLENGE_DB_URL is set on the axonos service to this stack's postgres only.

name: axonos-deposit-preview

services:
  axonos-launcher:
    build:
      context: .
      dockerfile: docker/launcher/Dockerfile
    container_name: axonos_session_launcher
    environment:
      AXGT_SESSION_LAUNCHER_BIND_HOST: 0.0.0.0
      AXGT_SESSION_LAUNCHER_BIND_PORT: ${AXGT_SESSION_LAUNCHER_BIND_PORT:-8090}
      AXGT_SESSION_LAUNCHER_TOKEN: ${AXGT_SESSION_LAUNCHER_TOKEN:-change-me-launcher-token}
      AXGT_HOST_SESSION_CONTAINER_IMAGE: ${AXGT_HOST_SESSION_CONTAINER_IMAGE:-axonos:deposit-preview}
      AXGT_HOST_SESSION_CONTAINER_NETWORK: ${AXGT_HOST_SESSION_CONTAINER_NETWORK:-axonos-deposit-preview_default}
      AXGT_HOST_SESSION_CONTAINER_COMMAND: ${AXGT_HOST_SESSION_CONTAINER_COMMAND:-/startup.sh}
      AXGT_HOST_SESSION_CONTAINER_EXTRA_ARGS: ${AXGT_HOST_SESSION_CONTAINER_EXTRA_ARGS:-}
      AXGT_HOST_SESSION_ENV_PASSTHROUGH: ${AXGT_HOST_SESSION_ENV_PASSTHROUGH:-AXGT_CHAIN_ID,AXGT_RPC_URL,AXGT_CONTRACT_ADDRESS,AXGT_REVENUE_WALLET,AXGT_CHALLENGE_DB_URL,AXGT_MIN_DEPOSIT,AXGT_CREDIT_PER_100_AXGT_MINUTES,ETH_MIN_DEPOSIT,ETH_CREDIT_PER_ETH_MINUTES,AXGT_ENABLE_ETH_DEPOSITS}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: axonos_postgres_deposit_preview
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axonos_gate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axonos_gate_secret}
      POSTGRES_DB: ${POSTGRES_DB:-axonos_gate}
    volumes:
      - axonos_postgres_data_deposit_preview:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axonos_gate} -d ${POSTGRES_DB:-axonos_gate}"]
      interval: 5s
      timeout: 5s
      retries: 5

  axonos:
    image: axonos:deposit-preview
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PASSWORD: ${AXONOS_VNC_PASSWORD}
    container_name: axonos_deposit_preview
    shm_size: "32gb"
    env_file: .env
    environment:
      AXGT_CHALLENGE_DB_URL: postgresql://${POSTGRES_USER:-axonos_gate}:${POSTGRES_PASSWORD:-axonos_gate_secret}@postgres:5432/${POSTGRES_DB:-axonos_gate}
      AXGT_USER_CONTAINER_ENABLED: ${AXGT_USER_CONTAINER_ENABLED:-true}
      AXGT_SESSION_LAUNCHER_MODE: ${AXGT_SESSION_LAUNCHER_MODE:-http}
      AXGT_SESSION_LAUNCHER_URL: ${AXGT_SESSION_LAUNCHER_URL:-http://axonos-launcher:8090}
      AXGT_SESSION_LAUNCHER_TOKEN: ${AXGT_SESSION_LAUNCHER_TOKEN:-change-me-launcher-token}
    depends_on:
      postgres:
        condition: service_healthy
      axonos-launcher:
        condition: service_healthy
    # Theme/wallpaper applied from startup.sh after 35s delay
    command: ["/startup.sh"]
    ports:
      - "${AXONOS_PUBLISH_NOVNC:-6080}:6080"
      - "${AXONOS_PUBLISH_GATE:-8889}:8889"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  axonos_postgres_data_deposit_preview: {}
