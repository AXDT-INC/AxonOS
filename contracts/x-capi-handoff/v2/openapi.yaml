        required: false
        schema:
          $ref: ./schemas/common.schema.json#/definitions/Click
        description: Initial observation only; one literal unambiguous name; discard/scrub invalid input
          and all query before renderer. No raw value in response. No receipt/cookie if disabled or GPC.
      responses:
        '200':
          description: Success; no side effects on financial or session operations
          headers:
            Cache-Control:
              schema:
                const: no-store, private
            Referrer-Policy:
              schema:
                const: no-referrer
            X-Content-Type-Options:
              schema:
                const: nosniff
          content:
            text/html:
              schema:
                type: string
          x-html-contract: browser-contract.md; callback safely embeds redeemed schema; authorize fixed
            form contains only v and handoff; entry contains no candidate raw click or H.
      x-body-limit-bytes: 8192
      x-no-query-parameters: false
      security: []
      x-query-byte-limit: 8192
      x-attribution-only: true
      description: The bridge HTML byte limit does not constrain the full marketing response; pre-render
        privacy invariants still apply.
      x-response-body-limit-bytes: null
