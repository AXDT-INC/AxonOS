name: Build and Push to Harbor

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: harbor.internal.oci.axondao.io
  IMAGE: axondao/axonos
  BUILDKIT_HOST: tcp://buildkitd.buildkit:1234
  BUILDKIT_VERSION: v0.21.1

# The builder has under 50 GB of disk in total and even the minimal variant
# (AXONOS_SKIP_HEAVY=1) needs a good share of it as scratch space. Two concurrent builds guarantee that both run out of
# disk, so serialise them; a newer push simply waits for the current build.
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: arc-runner-set-mgmt
    steps:
      - uses: actions/checkout@v4

      - name: Install buildctl
        run: |
          curl -sSL "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz" | \
            sudo tar -xz -C /usr/local

      # Every build that failed since June died with "No space left on device"
      # or apt's "not enough free space in /var/cache/apt/archives" inside the
      # buildkitd sandbox: the daemon's cache disk fills up with layers from
      # previous builds and nothing ever reclaims it. Drop the local cache
      # before building; layer cache is re-imported lazily from the registry
      # (see --import-cache below), so unchanged steps still hit.
      - name: Reclaim buildkitd storage
        run: |
          echo "::group::buildkitd cache before prune"
          buildctl du || true
          echo "::endgroup::"
          buildctl prune --all --verbose >/dev/null || true
          echo "::group::buildkitd cache after prune"
          buildctl du || true
          echo "::endgroup::"

      # The build sandbox shares the daemon's disk, so a throwaway build is the
      # only way to see how much room the real build gets.
      - name: Report buildkitd free space
        run: |
          d="$(mktemp -d)"
          printf 'FROM busybox:1.36\nRUN df -h / && df -h /tmp\n' > "$d/Dockerfile"
          buildctl build --frontend dockerfile.v0 --local context="$d" --local dockerfile="$d" \
            --no-cache --progress plain 2>&1 | grep -E 'Filesystem|overlay|/$|/tmp$' || true

      # AXONOS_SKIP_HEAVY=1 builds the minimal platform-core variant; the full
      # image (~135 GB) can never fit on this builder. See the Dockerfile header.
      #
      # --import-cache is fatal when the cache tag does not exist yet (first run
      # after a prune, or a fresh registry), so probe it with a no-op build and
      # only pass the flag when the importer configures successfully.
      - name: Build and push
        run: |
          set -o pipefail
          CACHE_REF="${REGISTRY}/${IMAGE}:buildcache"
          IMPORT_CACHE=()
          probe="$(mktemp -d)"
          printf 'FROM busybox:1.36\nRUN true\n' > "$probe/Dockerfile"
          if buildctl build --frontend dockerfile.v0 --local context="$probe" --local dockerfile="$probe" \
               --import-cache type=registry,ref="${CACHE_REF}" >/dev/null 2>&1; then
            IMPORT_CACHE=(--import-cache "type=registry,ref=${CACHE_REF}")
            echo "layer cache found at ${CACHE_REF}; importing"
          else
            echo "no layer cache at ${CACHE_REF}; building without import"
          fi
          buildctl build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --opt build-arg:AXONOS_SKIP_HEAVY=1 \
            "${IMPORT_CACHE[@]}" \
            --export-cache type=registry,ref="${CACHE_REF}",mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true \
            --output type=image,\"name=${REGISTRY}/${IMAGE}:sha-${GITHUB_SHA::7},${REGISTRY}/${IMAGE}:latest\",push=true
