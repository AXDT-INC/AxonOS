    <script>

        // delaying the wallet, payment, session, reconnect, or viewer UI.

            'use strict';
            var RAW_CLICK_RETENTION_MS = 10000;
            var initialClick = String(window.axonosPendingTwclid || '');

            window.axonosPendingTwclid = '';
