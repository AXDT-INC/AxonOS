[supervisord]
nodaemon=true

; Control socket so `supervisorctl status/restart <prog>` works inside the
; container (supervisord is launched with -c on this file, so the stock
; /etc/supervisor/supervisord.conf socket sections never load).
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# Headless X server on :0 with NVIDIA driver for VirtualGL (GPU-accelerated OpenGL over VNC).
# Start first so PyMOL and other OpenGL apps can use vglrun when container is run with --gpus all.
# Script exits 0 when no GPU so supervisord does not retry.
[program:xorg-nvidia]
command=/bin/bash -c "if [ \"${AXGT_DESKTOP_ENABLED:-true}\" = \"false\" ]; then exec sleep infinity; else exec /usr/local/bin/start-xorg-nvidia.sh; fi"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=2
priority=1

[program:jupyterlab]
; Jupyter defaults to loopback for safety. Override via env if you explicitly publish it.
; Run as the non-root user to avoid --allow-root.
command=/bin/bash -lc "su - ${USER:-aXonian} -c 'jupyter lab --ip=${JUPYTER_BIND:-127.0.0.1} --port=${JUPYTER_PORT:-8888} --no-browser'"

; Headless PulseAudio with a null sink (axonos_out). Desktop apps reach it via
; /etc/pulse/client.conf; the WebRTC agent captures axonos_out.monitor for the
; audio track. No X dependency — start before XFCE so apps never race the socket.
[program:pulseaudio]
command=/bin/bash -c "if [ \"${AXGT_DESKTOP_ENABLED:-true}\" = \"false\" ]; then exec sleep infinity; else rm -f /tmp/axonos-pulse.sock && exec su aXonian -s /bin/bash -c 'pulseaudio --daemonize=no --exit-idle-time=-1 --disallow-exit -nF /etc/pulse/axonos-default.pa'; fi"
environment=HOME="/home/aXonian",USER="aXonian"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=2

[program:xfce4]
command=/bin/bash -lc "if [ \"${AXGT_DESKTOP_ENABLED:-true}\" = \"false\" ]; then exec sleep infinity; else sleep 2 && su - aXonian -c 'DISPLAY=:0 startxfce4'; fi"
environment=HOME="/home/aXonian",USER="aXonian",DISPLAY=":0",XAUTHORITY="/home/aXonian/.Xauthority",VGL_DISPLAY=":0",OMPI_MCA_btl="vader,self,tcp",OMPI_MCA_btl_base_warn_component_unused="0"
directory=/home/aXonian

[program:x11vnc]
command=/bin/bash -c "if [ \"${AXGT_DESKTOP_ENABLED:-true}\" = \"false\" ] || [ -n \"${AXGT_SESSION_ID:-}\" ]; then exec sleep infinity; else sleep 3 && x11vnc -display :0 -rfbport 5901 -rfbauth /home/aXonian/.vnc/passwd -forever -shared -noxdamage; fi"
environment=HOME="/home/aXonian",USER="aXonian",DISPLAY=":0",XAUTHORITY="/home/aXonian/.Xauthority",VGL_DISPLAY=":0"
directory=/home/aXonian

[program:novnc]
command=/bin/bash -c "if [ -n \"${AXGT_SESSION_ID:-}\" ]; then exec sleep infinity; else sleep 3 && exec /usr/bin/python3 /axonos_gate/websockify_gate.py; fi"
autorestart=true
; websockify forks one worker per accepted connection. Stop the whole process
; group so a supervisor restart cannot orphan workers that retain port 6080.
stopasgroup=true
killasgroup=true
; Configuration is provided via container environment variables.

; One central, persistent NVML sampler publishes an atomic snapshot for the
; forked noVNC/gate workers. Tenant containers must not each sample the host.
[program:gpu-telemetry]
command=/bin/bash -c "if [ -n \"${AXGT_SESSION_ID:-}\" ]; then exec sleep infinity; else exec /usr/bin/python3 /axonos_gate/gpu_telemetry_collector.py; fi"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=1
startretries=3
stopasgroup=true
killasgroup=true
priority=2

[program:axgt-api]
command=/bin/bash -c "if [ -n \"${AXGT_SESSION_ID:-}\" ]; then exec sleep infinity; else sleep 4 && exec env GATE_AGENT_API_ENABLED=false GATE_AGENT_ONLY=false /usr/bin/python3 /axonos_gate/gate_server.py; fi"
; Bind the separate AXGT API to localhost by default to reduce external surface.
; The primary verify endpoint is served on the same origin via websockify_gate.py.
; Configuration is provided via container environment variables (gate defaults are localhost:8889).

; Central-only WebRTC agent API. This port is deliberately not host-published;
; launcher-managed agents reach it through their isolated Docker network.
[program:webrtc-agent-gate]
command=/bin/bash -c "shopt -s nocasematch && [[ -z \"${AXGT_SESSION_ID:-}\" ]] && [[ \"${WEBRTC_ENABLED:-false}\" =~ ^(1|true|yes|on)$ ]] && exec env GATE_PORT=8890 GATE_AGENT_API_ENABLED=true GATE_AGENT_ONLY=true GATE_USE_GEVENT=0 /usr/bin/python3 /axonos_gate/gate_server.py || exec sleep infinity"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3

; WebRTC streaming agent (same container as desktop). Multi-session agents use
; AXGT_WEBRTC_AGENT_TOKEN; the fleet signing key remains in the central gate.
; Start immediately: the agent retries an unavailable gate and performs its own
; bounded display-readiness check before capture, so a second fixed-delay gate
; here only extends negotiation.
[program:webrtc-agent]
command=/bin/bash -c "shopt -s nocasematch && [[ \"${WEBRTC_ENABLED:-false}\" =~ ^(1|true|yes|on)$ ]] && [[ \"${WEBRTC_AGENT_ENABLED:-true}\" =~ ^(1|true|yes|on)$ ]] && exec /usr/bin/python3 /axonos_gate/webrtc_agent_main.py || exec sleep infinity"
environment=HOME="/root",USER="root",DISPLAY=":0",XAUTHORITY="/home/aXonian/.Xauthority",VGL_DISPLAY=":0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3

; Per-session file transfer and telemetry agent (file_agent.py). Desktop and
; SSH-only sessions both have a persistent home and browser telemetry sidebar,
; so run it when either session surface is enabled. It stays private on the
; session docker network and runs as the desktop user so files land with correct
; ownership. Auth: AXGT_SESSION_FILES_KEY (per-session) or a local key file in
; shared single-instance mode.
[program:file-agent]
command=/bin/bash -c "shopt -s nocasematch && { [[ \"${AXGT_DESKTOP_ENABLED:-true}\" =~ ^(1|true|yes|on)$ ]] || [[ \"${AXGT_SSH_ENABLED:-false}\" =~ ^(1|true|yes|on)$ ]]; } && exec /usr/bin/python3 /axonos_gate/file_agent.py || exec sleep infinity"
user=aXonian
environment=HOME="/home/aXonian",USER="aXonian"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

; Direct-SSH session shell. Runs only when AXGT_SSH_ENABLED=true (set per-session
; by the launcher for the landing-page SSH toggle). Host keys, authorized_keys and
; the hardened sshd_config drop-in are written by startup.sh before supervisord
; starts. sshd runs as root for privilege separation; logins are pubkey-only and
; restricted to the aXonian user (PermitRootLogin no, AllowUsers aXonian).
[program:sshd]
command=/bin/bash -c "shopt -s nocasematch && [[ \"${AXGT_SSH_ENABLED:-false}\" =~ ^(1|true|yes|on)$ ]] && exec /usr/sbin/sshd -D -e || exec sleep infinity"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3

; Private browser-terminal broker for SSH-only sessions. The service port is
; reachable only across the per-session Docker network and is never host-
; published. Keep the broker root-owned so the tenant cannot inspect its
; per-session credential; terminal_agent.py drops groups/gid/uid to aXonian in
; the PTY child immediately before executing the login shell.
[program:terminal-agent]
command=/bin/bash -c "shopt -s nocasematch && [[ \"${AXGT_SSH_ENABLED:-false}\" =~ ^(1|true|yes|on)$ ]] && [[ -n \"${AXGT_SESSION_FILES_KEY:-}\" ]] && exec /usr/bin/python3 /axonos_gate/terminal_agent.py || exec sleep infinity"
environment=HOME="/root",USER="root"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3

; Durable in-container heartbeat for every tenant session, including desktops.
; Runtime ownership and billing survive browser Detach, reload, and tab close;
; browser heartbeats are only an additional signal. Auth uses the per-session
; AXGT_SESSION_FILES_KEY. Without this daemon, a healthy detached runtime would
; be reaped after AXGT_HEARTBEAT_TIMEOUT_SECONDS (~120s).
[program:heartbeat-daemon]
command=/usr/bin/python3 /axonos_gate/session_heartbeat_daemon.py
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3

[program:ollama]
command=ollama serve
environment=OLLAMA_CONTEXT_LENGTH="65536"
autorestart=true
priority=10

; Persistent agent backend for AxonAI. It stays loopback-only and
; runs as the desktop user, so its filesystem authority cannot exceed the
; user's own workspace permissions.
[program:opencode]
command=/usr/bin/env -u OPENCODE_CONFIG_DIR -u OPENCODE_TEST_HOME -u OPENCODE_PERMISSION -u OPENCODE_PURE -u OPENCODE_EXPERIMENTAL -u OPENCODE_EXPERIMENTAL_BACKGROUND_SUBAGENTS /usr/local/libexec/opencode serve --hostname 127.0.0.1 --port 4096
user=aXonian
directory=/home/aXonian
environment=HOME="/var/empty/axonos-opencode",USER="aXonian",XDG_CONFIG_HOME="/etc/axonos-opencode",XDG_DATA_HOME="/var/lib/axonos-opencode/data",XDG_STATE_HOME="/var/lib/axonos-opencode/state",XDG_CACHE_HOME="/var/cache/axonos-opencode",OPENCODE_CONFIG="/etc/axonos-opencode/opencode.json",OPENCODE_CONFIG_CONTENT="",OPENCODE_DISABLE_PROJECT_CONFIG="true",OPENCODE_DISABLE_EXTERNAL_SKILLS="true",OPENCODE_DISABLE_CLAUDE_CODE="true",OPENCODE_DISABLE_AUTOUPDATE="true"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
priority=20

[program:ipfs]
command=/usr/local/bin/ipfs daemon --enable-gc --routing=dht
user=aXonian
environment=HOME="/home/aXonian",USER="aXonian",IPFS_PATH="/home/aXonian/.ipfs"
directory=/home/aXonian
autorestart=true
autostart=true
